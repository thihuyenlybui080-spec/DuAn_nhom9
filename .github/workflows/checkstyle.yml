name: Code Style Check

# Cấu hình để workflow chạy khi có ai đó push hoặc tạo Pull Request
on:
  push:
    branches: [ "main", "dev_Thuy" ]
  pull_request:
    branches: [ "main", "dev_Thuy" ]

jobs:
  checkstyle:
    name: Run Checkstyle
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Execute Checkstyle
      working-directory: ./AuctionSystem_final
      run: mvn checkstyle:check
